<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лучшие фильмы 2025 года | Vision+</title>
</head>
<body>
    <main>
        <h1>Лучшие фильмы 2025 года</h1>
        <video src="/assets/video2.mp4" controls width="100%"></video>
        <p>Описание: Подборка лучших фильмов 2025 года.</p>
        <section style="margin:32px 0;">
            <form>
                <label>Оцените видео:</label><br>
                <span>
                    <input type="radio" name="rating" id="star5" value="5">
                    <label for="star5">★</label>
                    <input type="radio" name="rating" id="star4" value="4">
                    <label for="star4">★</label>
                    <input type="radio" name="rating" id="star3" value="3">
                    <label for="star3">★</label>
                    <input type="radio" name="rating" id="star2" value="2">
                    <label for="star2">★</label>
                    <input type="radio" name="rating" id="star1" value="1">
                    <label for="star1">★</label>
                </span>
            </form>
            <form style="margin-top:18px;">
                <label for="comment">Комментарий:</label><br>
                <textarea id="comment" name="comment" rows="3" cols="40" placeholder="Ваш комментарий..."></textarea><br>
                <button type="submit">Отправить</button>
            </form>
        </section>
        <a href="../index.html">Назад</a>
    </main>
</body>
</html>
