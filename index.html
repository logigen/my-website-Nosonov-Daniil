<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Vision+ — Смотри видео онлайн</title>
    <link rel="stylesheet" href="/my-website-Nosonov-Daniil/assets/style.css">
</head>
<body>

<!-- ШАПКА -->
<div class="topbar">
    <a href="index.html" class="logo">
        <span class="logo-you">Vision</span><span class="logo-tube">+</span>
        <span class="logo-tagline"></span>
    </a>
    <div class="topbar-right">
        <a href="#">Войти</a> |
        <a href="#">Регистрация</a> |
        <a href="#">Помощь</a>
    </div>
</div>

<div class="searchbar">
    <input type="text" id="search-input" placeholder="Поиск видео...">
    <select>
        <option>Видео</option>
        <option>Авторы</option>
    </select>
    <input type="submit" class="btn-search" value="Найти" onclick="doSearch()">
    <button class="btn-upload">Загрузить</button>
</div>

<div class="mainnav">
    <a href="index.html" class="active">Главная</a>
    <a href="#">Видео</a>
    <a href="#">Каналы</a>
    <a href="#">Категории</a>
    <a href="#">Загрузить</a>
</div>

<div class="subnav">
    <a href="#">Мои видео</a> |
    <a href="#">Мои подписки</a> |
    <a href="#">Плейлисты</a> |
    <a href="#">Мой профиль</a>
</div>

<div class="page">

    <div class="main">
        <div class="section-head">
            <h2 id="main-heading">Все видео</h2>
            <span id="video-count" style="font-size:12px;color:#666;"></span>
        </div>

        <!-- горизонтальная лента -->
        <div class="director-row" id="thumb-row"></div>

        <div class="section-head" style="margin-top:14px;">
            <h2>Популярные видео</h2>
        </div>

        <!-- список с описанием -->
        <div id="featured-list"></div>
    </div>

    <div class="sidebar">

        <div class="login-block">
            <div class="lb-title">Войти на Vision+</div>
            <label>Имя пользователя:</label>
            <input type="text">
            <label>Пароль:</label>
            <input type="password">
            <div style="margin-top:4px;">
                <input type="submit" class="btn-default" value="Войти">
                <input type="submit" class="btn-yellow" value="Регистрация">
            </div>
            <div class="forgot">Забыли? <a href="#">Имя</a> | <a href="#">Пароль</a></div>
        </div>

    </div>
</div>

<footer>
    <a href="#">О проекте</a>
    <a href="./other/contact.html" class="active">Контакты</a>
    <br><br>
    &copy; 2026 Vision+ &nbsp;|&nbsp; Все права защищены
</footer>

<script src="/my-website-Nosonov-Daniil/assets/videos.js"></script>
<script>

function starsHTML(n) {
    return `<span class="stars">${'★'.repeat(n)}</span><span class="stars-grey">${'★'.repeat(5-n)}</span>`;
}

function renderThumbRow(list) {
    document.getElementById('thumb-row').innerHTML = list.map(v => `
        <div class="thumb-small">
            <a href="videos/${v.id}.html" class="thumb-img ${v.bg}">
                ${v.preview ? `<img src="${v.preview}" alt="${v.title}">` : ''}
                <span class="duration">${v.duration}</span>
            </a>
            <a href="videos/${v.id}.html" class="thumb-title">${v.title}</a>
            <div class="thumb-meta">От: ${v.author}</div>
            <div class="thumb-meta">${v.views} просм.</div>
        </div>
    `).join('');
}

function renderFeatured(list) {
    document.getElementById('featured-list').innerHTML = list.length
        ? list.map(v => `
            <div class="featured-item">
                <a href="videos/${v.id}.html" class="featured-thumb ${v.bg}">
                    ${v.preview ? `<img src="${v.preview}" alt="${v.title}">` : ''}
                    <span class="duration">${v.duration}</span>
                </a>
                <div class="featured-info">
                    <a href="videos/${v.id}.html" class="title">${v.title}</a>
                    <div class="desc">${v.description}</div>
                    <div class="tags">Теги: ${v.tags.map(t=>`<a href="#">${t}</a>`).join(' ')}</div>
                    <div class="meta">Добавлено: ${v.added} &nbsp; Категория: <a href="#">${v.category}</a></div>
                    <div>${starsHTML(v.rating)} ${v.ratings} оценок</div>
                    <div class="views">Просмотров: <b>${v.views}</b></div>
                </div>
            </div>
        `).join('')
        : '<p style="color:#666;padding:10px 0;">Ничего не найдено.</p>';
}

function renderChannels() {
    const unique = VIDEOS.filter((v,i,a) => a.findIndex(x=>x.author===v.author)===i).slice(0,5);
    document.getElementById('channels-list').innerHTML = unique.map(v => `
        <div class="channel-item">
            <div class="channel-avatar ${v.bg}" style="color:#fff;">${v.author[0]}</div>
            <div class="channel-info">
                <div class="name"><a href="#">${v.author}</a></div>
                <div class="subs">${VIDEOS.filter(x=>x.author===v.author).length} видео</div>
            </div>
        </div>
    `).join('');
}

function renderStats() {
    const totalViews = VIDEOS.reduce((s,v) => s + parseInt(v.views.replace(/\s/g,'')), 0);
    document.getElementById('stats').innerHTML = `
        Видео: <b>${VIDEOS.length}</b><br>
        Авторов: <b>${new Set(VIDEOS.map(v=>v.author)).size}</b><br>
        Сейчас онлайн: <b>47</b><br>
        Просмотров всего: <b>${totalViews.toLocaleString('ru')}</b>
    `;
    document.getElementById('video-count').textContent = `${VIDEOS.length} видео`;
}

function doSearch() {
    const q = document.getElementById('search-input').value.toLowerCase().trim();
    const list = q
        ? VIDEOS.filter(v =>
            v.title.toLowerCase().includes(q) ||
            v.author.toLowerCase().includes(q) ||
            v.tags.some(t=>t.toLowerCase().includes(q)) ||
            v.category.toLowerCase().includes(q)
          )
        : VIDEOS;
    document.getElementById('main-heading').textContent = q ? `Поиск: «${q}»` : 'Все видео';
    renderThumbRow(list);
    renderFeatured(list);
}

document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
});

// Старт
const byViews = [...VIDEOS].sort((a,b) =>
    parseInt(b.views.replace(/\s/g,'')) - parseInt(a.views.replace(/\s/g,''))
);
renderThumbRow(VIDEOS);
renderFeatured(byViews);
renderChannels();
renderStats();

</script>
</body>
</html>
